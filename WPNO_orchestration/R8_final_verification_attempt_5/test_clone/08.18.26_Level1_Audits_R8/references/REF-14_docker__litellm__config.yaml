router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 120
  fallbacks: [{"endredaktion": ["schriftsatz"]}, {"schriftsatz": ["triage"]}]
  allowed_fails: 2
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false
  callbacks: ["custom_callback.proxy_handler_instance"]
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 86400
    supported_call_types: ["acompletion", "completion"]
  # Langfuse-Callback entfernt 2026-07-27: Stack (docker/langfuse/) war nie
  # gestartet (keine Container/Volumes) -> Callback lief bei jedem Call in
  # einen Fehler. Observability gem. Paper §8.E laeuft ueber Postgres.
  # Reaktivierung erst, wenn der Langfuse-Stack real deployed ist.
  success_callback: ["postgres"]
  failure_callback: ["postgres"]

general_settings:
  master_key: [REDACTED:MASTER_KEY]
  database_url: [REDACTED:DATABASE_URL]
  max_budget: 150.0   # F-002: Realguthaben 200 EUR, Cap mit Puffer darunter (K9)
  budget_duration: 30d
  enforce_user_param: true
